name: Automations Cron

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  run-automations:
    runs-on: ubuntu-latest
    steps:
      - name: Validate required secrets
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          AUTOMATIONS_RUN_TOKEN: ${{ secrets.AUTOMATIONS_RUN_TOKEN }}
        run: |
          if [ -z "$APP_BASE_URL" ]; then
            echo "Missing APP_BASE_URL secret in GitHub Actions.";
            exit 1;
          fi
          if [ -z "$AUTOMATIONS_RUN_TOKEN" ]; then
            echo "Missing AUTOMATIONS_RUN_TOKEN secret in GitHub Actions.";
            exit 1;
          fi

      - name: Trigger no-response and SLA automations
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          AUTOMATIONS_RUN_TOKEN: ${{ secrets.AUTOMATIONS_RUN_TOKEN }}
        run: |
          curl --fail --show-error --silent \
            -X GET "$APP_BASE_URL/api/automations/no-response?target=all" \
            -H "authorization: Bearer $AUTOMATIONS_RUN_TOKEN" \
            -H "x-automation-token: $AUTOMATIONS_RUN_TOKEN"
